name: On Pull Request

on:
  push:
    branches:
      - main
    paths:
      - "kafka/**"
      - ".github/**/*.yml"
  pull_request:
    branches:
      - main
    paths:
      - "kafka/**"
      - ".github/**/*.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  # Shared DMS fixture pin; validate-dms-fixture-ref.sh keeps it main-reachable and fixture-current.
  DMS_FIXTURE_REF: adc562b669d7b34c1a1ef9b84b53f0f93082e5f0

jobs:
  scan-actions-bidi:
    name: Scan Actions, scan all files for BIDI Trojan Attacks
    uses: Ed-Fi-Alliance-OSS/Ed-Fi-Actions/.github/workflows/repository-scanner.yml@main
    with:
      config-file-path: ./.github/workflows/bidi-config.json

  verify-runtime-java:
    name: Verify runtime Java compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Guards against UnsupportedClassVersionError: the SMT jar is compiled to a Java bytecode
      # target (build.gradle), but it is loaded by the JDK inside the deployment runtime image
      # (debezium/connect, see kafka/Dockerfile) -- NOT by CI's Temurin build JDK. This reads the
      # runtime JDK from the image itself and fails if it is older than the bytecode target.
      - name: Verify the runtime JDK can load the compiled SMT bytecode
        run: |
          set -euo pipefail
          target=$(grep -oP 'targetCompatibility\s*=\s*JavaVersion\.VERSION_\K[0-9]+' \
            kafka/ed-fi-kafka-connect-transforms/build.gradle)
          image=$(grep -oP '^FROM \K(?:quay\.io/)?debezium/connect:\S+' kafka/Dockerfile | head -n1)
          echo "SMT bytecode target: Java $target"
          echo "Runtime image:       $image"
          # "|| true" so an unrecognized version banner reaches the -z diagnostic below instead
          # of set -e killing the script at this assignment with a bare exit code.
          runtime=$(docker run --rm --entrypoint java "$image" -version 2>&1 \
            | grep -oiE '(openjdk|java) version "[0-9]+' | grep -oE '[0-9]+$' | head -n1 || true)
          echo "Runtime JDK major:   $runtime"
          if [ -z "$runtime" ]; then
            echo "::error::Could not determine the runtime JDK version from $image"
            exit 1
          fi
          if [ "$runtime" -lt "$target" ]; then
            echo "::error::Runtime JDK $runtime is older than the SMT bytecode target $target; the plugin would fail to load with UnsupportedClassVersionError."
            exit 1
          fi
          echo "OK: runtime JDK $runtime can load Java $target bytecode."

  verify-image-plugins:
    name: Verify the SMT plugins load and execute on Kafka Connect 4.3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4.6.0
        with:
          java-version: '17'
          distribution: 'temurin'

      # DMS-1240 acceptance: the published image must actually ship and load the transforms.
      # Building the image runs the full Gradle build stage and layers the SMT jar onto the
      # plugin path, exactly as docker-publish.yml will at release time.
      - name: Build the Kafka Connect image
        run: docker build -t ed-fi-kafka-connect:smoke --build-context parentdir=. -f kafka/Dockerfile kafka

      - name: Verify the built image runtime pin
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash ed-fi-kafka-connect:smoke -lc '
            test -f /kafka/libs/connect-api-4.3.0.jar
            test -f /kafka/libs/kafka_2.13-4.3.0.jar
            test -f /kafka/libs/jackson-databind-2.21.2.jar
          '
          echo "OK: built image contains Kafka Connect 4.3.0 and Jackson 2.21.2 runtime jars."

      # The class list under test is read from the ServiceLoader manifests — the single source
      # of truth for what the plugin ships — so a provider added to a manifest is verified
      # here without touching this workflow.
      - name: Read the plugin class lists from the ServiceLoader manifests
        run: |
          set -euo pipefail
          : > plugin-classes.txt
          for manifest in \
            "kafka/ed-fi-kafka-connect-transforms/src/main/resources/META-INF/services/org.apache.kafka.connect.transforms.Transformation" \
            "kafka/ed-fi-kafka-connect-transforms/src/main/resources/META-INF/services/org.apache.kafka.connect.storage.Converter"; do
            classes=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' "$manifest" | grep -v '^$' || true)
            if [ -z "$classes" ]; then
              echo "::error::No plugin classes listed in $manifest"
              exit 1
            fi
            printf '%s\n' "$classes" >> plugin-classes.txt
          done
          cat plugin-classes.txt

      # connect-plugin-path.sh scans the plugin path with the image's own JDK and reports
      # per-plugin isLoadable and hasManifest columns, catching a jar that is missing from the
      # image, compiled to bytecode the runtime cannot load, or shipped without its KIP-898
      # ServiceLoader manifest. It stops at class linking: dependencies referenced only from
      # method bodies (e.g. Jackson) are not resolved until the transform executes, which the
      # execution smoke below covers.
      - name: Verify the plugin classes load in the image (Kafka Connect 4.3 runtime)
        run: |
          set -euo pipefail
          plugins=$(docker run --rm --entrypoint /kafka/bin/connect-plugin-path.sh \
            ed-fi-kafka-connect:smoke list --plugin-path /kafka/connect)
          echo "$plugins"
          while IFS= read -r class; do
            row=$(grep -F "$class" <<<"$plugins" || true)
            if [ -z "$row" ]; then
              echo "::error::$class was not discovered on the image plugin path"
              exit 1
            fi
            loadable=$(cut -f6 <<<"$row")
            manifest=$(cut -f7 <<<"$row")
            if [ "$loadable" != "true" ] || [ "$manifest" != "true" ]; then
              echo "::error::$class: isLoadable=$loadable hasManifest=$manifest (both must be true): $row"
              exit 1
            fi
          done < plugin-classes.txt
          echo "OK: all Ed-Fi plugin classes load in the image and carry ServiceLoader manifests."

      - name: Extract the plugin directory and runtime classpath from the image
        run: |
          set -euo pipefail
          docker create --name smt-extract ed-fi-kafka-connect:smoke
          docker cp smt-extract:/kafka/connect/ed-fi-kafka-connect-transforms ./smt-plugin
          docker cp smt-extract:/kafka/libs ./image-libs
          docker rm smt-extract

      - name: Verify DocumentState transform and converter ship in the same image artifact
        run: |
          set -euo pipefail
          jar_path=$(find smt-plugin -maxdepth 1 -name '*.jar' | head -n1)
          if [ -z "$jar_path" ]; then
            echo "::error::No Ed-Fi Kafka Connect transform jar found in the image plugin directory"
            exit 1
          fi
          jar tf "$jar_path" | grep -Fx org/edfi/kafka/connect/transforms/DocumentState.class
          jar tf "$jar_path" | grep -Fx org/edfi/kafka/connect/converters/DocumentStateJsonConverter.class
          echo "OK: DocumentState and DocumentStateJsonConverter are packaged together in $jar_path."

      # The load checks above stop at linking. Jackson is provided by the Connect runtime
      # (compileOnly in build.gradle, not bundled in the plugin jar) and is first resolved when
      # the transforms process a record, so a missing or incompatible runtime Jackson passes
      # every load check and fails on the first record. This compiles the smoke classes against
      # the image's own jars and runs them inside the pinned Debezium 3.6 / Kafka Connect 4.3
      # image runtime classpath.
      - name: Compile the image execution smokes
        run: |
          set -euo pipefail
          mkdir -p smoke-classes
          javac --release 17 -proc:none -cp "image-libs/*:smt-plugin/*" -d smoke-classes \
            kafka/ci-smoke/ExpandJsonExecutionSmoke.java \
            kafka/ci-smoke/DocumentStateExecutionSmoke.java

      - name: Checkout DMS shared document fixtures
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Ed-Fi-Alliance-OSS/Data-Management-Service
          ref: ${{ env.DMS_FIXTURE_REF }}
          fetch-depth: 0
          path: dms

      - name: Validate DMS fixture pin
        run: bash ${{ github.workspace }}/.github/scripts/validate-dms-fixture-ref.sh ${{ github.workspace }}/dms

      - name: Run the ExpandJson execution smoke inside the Kafka Connect 4.3 image
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/smoke-classes:/smoke:ro" --entrypoint java \
            ed-fi-kafka-connect:smoke \
            -cp '/smoke:/kafka/libs/*:/kafka/connect/ed-fi-kafka-connect-transforms/*' \
            ExpandJsonExecutionSmoke

      - name: Run the DocumentState execution smoke inside the Kafka Connect 4.3 image
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/smoke-classes:/smoke:ro" \
            -v "$PWD/dms/src/dms/backend/Fixtures/document-cache/materialized-documents/school-address-property-absence:/fixtures/school-address-property-absence:ro" \
            --entrypoint java \
            ed-fi-kafka-connect:smoke \
            -cp '/smoke:/kafka/libs/*:/kafka/connect/ed-fi-kafka-connect-transforms/*' \
            DocumentStateExecutionSmoke /fixtures/school-address-property-absence

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kafka/ed-fi-kafka-connect-transforms
    steps:
      - name: Checkout the Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout DMS fixtures
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Ed-Fi-Alliance-OSS/Data-Management-Service
          ref: ${{ env.DMS_FIXTURE_REF }}
          fetch-depth: 0
          path: dms

      - name: Validate DMS fixture pin
        run: bash ${{ github.workspace }}/.github/scripts/validate-dms-fixture-ref.sh ${{ github.workspace }}/dms

      - name: Dependency Review ("Dependabot on PR")
        if: ${{ github.event_name == 'pull_request' && !github.event.repository.fork }}
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0

      - name: Setup Java
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4.6.0
        with: 
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0bdd871935719febd78681f197cd39af5b6e16a6 # v4.2.2
        with:
          # Pin Gradle 8.x: build.gradle's wrapper block imports org.gradle.util classes
          # (DistributionLocator, GradleVersion) that were removed in Gradle 9. See DMS-1240.
          gradle-version: "8.10"

      - name: Generate Gradle wrapper
        run: gradle wrapper        

      - name: Make gradlew executable
        run: chmod +x ./gradlew        

      - name: Build with Gradle
        run: ./gradlew clean build -PedfiDmsMaterializedDocumentFixtureRoot=${{ github.workspace }}/dms/src/dms/backend/Fixtures/document-cache/materialized-documents

      - name: Run tests with Gradle
        run: ./gradlew test -PedfiDmsMaterializedDocumentFixtureRoot=${{ github.workspace }}/dms/src/dms/backend/Fixtures/document-cache/materialized-documents
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5
        with:
          name: Unit Test Results
          overwrite: true
          path: |
            ./kafka/ed-fi-kafka-connect-transforms/build/reports/tests/test/classes/*.html

      - name: Upload build artifacts
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5
        with:
          name: Package
          path: ./kafka/ed-fi-kafka-connect-transforms/build/libs

      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        name: Run Linter on Dockerfile
        with:
          dockerfile: ./kafka/Dockerfile
          failure-threshold: error
