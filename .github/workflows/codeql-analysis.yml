name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: read-all

jobs:
  code-analysis:
    name: Code Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kafka/ed-fi-kafka-connect-transforms
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
    
    steps:
    - name: Checkout the Repo
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Checkout DMS fixtures
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: Ed-Fi-Alliance-OSS/Data-Management-Service
        ref: 2dece6c0c02b7ef9bd4af88185eae1e2a2ef95bc
        path: dms

    - name: Setup Java
      uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4.6.0
      with: 
        java-version: '17'
        distribution: 'temurin'

    - name: Dependency Review ("Dependabot on PR")
      if: ${{ github.event_name == 'pull_request' && !github.event.repository.fork }}
      uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0

    - name: Initialize CodeQL
      uses: github/codeql-action/init@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
      with:
        languages: java

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0bdd871935719febd78681f197cd39af5b6e16a6 # v4.2.2
      with:
        # Pin Gradle 8.x: build.gradle's wrapper block imports org.gradle.util classes
        # (DistributionLocator, GradleVersion) that were removed in Gradle 9. See DMS-1240.
        gradle-version: "8.10"

    - name: Generate Gradle wrapper
      run: gradle wrapper

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew clean build -PedfiDmsMaterializedDocumentFixtureRoot=${{ github.workspace }}/dms/src/dms/backend/Fixtures/document-cache/materialized-documents

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
