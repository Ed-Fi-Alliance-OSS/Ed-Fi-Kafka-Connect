import org.gradle.util.DistributionLocator
import org.gradle.util.GradleVersion

plugins {
    // https://docs.gradle.org/current/userguide/java_library_plugin.html
    id 'java-library'

    // https://docs.gradle.org/current/userguide/distribution_plugin.html
    id 'distribution'

    // https://docs.gradle.org/current/userguide/checkstyle_plugin.html
    id 'checkstyle'
}

repositories {
    mavenCentral()
}

// The SMT jar is compiled to Java 17 bytecode. The deployment runtime
// (debezium/connect:2.7.0.Final, see ../Dockerfile) ships OpenJDK 21, which loads Java 17 classes
// without UnsupportedClassVersionError. Two CI jobs in .github/workflows/on-pullrequest.yml guard
// this on every change: "Verify runtime Java compatibility" enforces runtime JDK >= this target,
// and "Verify the SMT plugins load (Connect 3.x and 4.x) and execute" builds the image, proves
// the transform classes load inside it and under Kafka Connect 4.x, and executes ExpandJson on
// one record against both runtime classpaths.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

ext {
    // Match the Kafka version shipped in the Debezium/Connect runtime image
    // (debezium/connect:2.7.0.Final runs Kafka 3.7.0, see ../Dockerfile) so the SMT cannot
    // compile against connect-api members newer than the runtime classpath it loads on.
    kafkaVersion = "3.7.0"
    debeziumVersion = "2.7.0.Final"
    // Match the Jackson version already shipped in the Debezium/Connect runtime image
    // so the transform relies on the runtime's Jackson (compileOnly) and bundles nothing.
    jacksonVersion = "2.16.0"
}

distributions {
    main {
        contents {
            from jar
            from configurations.runtimeClasspath
        }
    }
}

wrapper {
    distributionType = 'ALL'
    doLast {
        final DistributionLocator locator = new DistributionLocator()
        final GradleVersion version = GradleVersion.version(wrapper.gradleVersion)
        final URI distributionUri = locator.getDistributionFor(version, wrapper.distributionType.name().toLowerCase(Locale.ENGLISH))
        final URI sha256Uri = new URI(distributionUri.toString() + ".sha256")
        final String sha256Sum = new String(sha256Uri.toURL().bytes)
        wrapper.getPropertiesFile() << "distributionSha256Sum=${sha256Sum}\n"
        println "Added checksum to wrapper properties"
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}

dependencies {
    compileOnly "org.apache.kafka:connect-api:$kafkaVersion"
    compileOnly "io.debezium:debezium-api:$debeziumVersion"
    // Jackson is provided by the Connect runtime; compile against it but do not bundle it.
    compileOnly "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"

    implementation "org.slf4j:slf4j-api:1.7.36"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.0"
    testImplementation "org.apache.kafka:connect-api:$kafkaVersion"
    testImplementation "io.debezium:debezium-api:$debeziumVersion"
    testImplementation "org.assertj:assertj-core:3.24.2"
    // Test runtime needs Jackson (compileOnly above is not on the test classpath) and
    // connect-json for the JsonConverter round-trip that verifies the serialized shape.
    testImplementation "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
    testImplementation "org.apache.kafka:connect-json:$kafkaVersion"

    testRuntimeOnly "org.apache.logging.log4j:log4j-slf4j-impl:2.20.0"
    testRuntimeOnly "org.apache.logging.log4j:log4j-api:2.20.0"
    testRuntimeOnly "org.apache.logging.log4j:log4j-core:2.20.0"
}

checkstyle {
    toolVersion "8.21"
}

test {
    useJUnitPlatform {
        includeEngines 'junit-jupiter'
    }
}

jar {
    manifest {
        attributes(
                'Version': "${getArchiveVersion()}"
        )
    }
}

def setVersionInGradleProperties(ver) {
    logger.quiet('Changing version in gradle.properties to {}', ver)
    file('gradle.properties.new').withWriter { writer ->
        file('gradle.properties').eachLine { line ->
            if (line ==~ /version=.*/) {
                writer.writeLine("version=${ver}")
            } else {
                writer.writeLine(line)
            }
        }
    }
    file('gradle.properties.new').renameTo('gradle.properties')
}

def releaseTag() {
    return 'v' + releaseVersion
}
